<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffe2ec">
  <title>我的小小世界 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: grid; place-items: center; overflow-x: hidden;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      color: #754255;
      background: linear-gradient(135deg, #ffe4ec, #fff0f5 48%, #ffd6e5);
    }
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .heart {
      position: absolute; bottom: -40px; opacity: .45;
      animation: floatUp 9s linear infinite; color: #f28bad;
    }
    .heart:nth-child(1) { left: 8%; animation-delay: 0s; font-size: 22px; }
    .heart:nth-child(2) { left: 28%; animation-delay: 2s; font-size: 16px; }
    .heart:nth-child(3) { left: 73%; animation-delay: 1s; font-size: 25px; }
    .heart:nth-child(4) { left: 91%; animation-delay: 4s; font-size: 18px; }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0); opacity: 0; }
      15% { opacity: .5; } 100% { transform: translateY(-110vh) rotate(35deg); opacity: 0; }
    }
    .card {
      position: relative; width: min(100%, 410px); padding: 36px 25px 30px;
      text-align: center; border: 1px solid rgba(255,255,255,.85);
      border-radius: 28px; background: rgba(255,255,255,.82);
      box-shadow: 0 18px 55px rgba(190, 93, 128, .18);
      backdrop-filter: blur(12px);
    }
    .flower { font-size: 38px; margin-bottom: 8px; }
    h1 { margin: 0 0 12px; color: #d95786; font-size: 27px; }
    .intro { margin: 0 auto 24px; line-height: 1.9; color: #8c6575; font-size: 15px; }
    .button {
      border: 0; border-radius: 999px; padding: 14px 28px;
      color: white; font-size: 16px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, #f48caf, #e65d91);
      box-shadow: 0 8px 20px rgba(230, 93, 145, .28);
      transition: transform .2s, box-shadow .2s;
    }
    .button:active { transform: scale(.97); }
    .qr-panel {
      display: none; margin-top: 24px; padding: 18px 14px;
      border-radius: 20px; background: #fff7fa; border: 1px solid #f9d8e4;
    }
    .qr-panel.show { display: block; animation: appear .25s ease-out; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .qr-panel img { display: block; width: min(100%, 260px); height: auto; margin: 12px auto; border-radius: 12px; }
    .qr-note { font-size: 13px; color: #9b7584; line-height: 1.7; margin: 8px 0 0; }
    .footer { margin-top: 22px; font-size: 12px; color: #b18a99; }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart">♥</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="heart">♥</span>
  </div>
  <main class="card">
    <div class="flower">🌷</div>
    <h1>欢迎来到我的小小世界</h1>
    <p class="intro">谢谢你来到这里。<br>愿每一份善意，都被温柔以待。💗</p>
    <button class="button" type="button" id="supportBtn" aria-expanded="false">
      💖 支持一下
    </button>
    <section class="qr-panel" id="qrPanel" aria-live="polite">
      <strong>谢谢你的支持！</strong>
      <img src="wechat-pay.jpg" alt="微信收款二维码">
      <p class="qr-note">请使用微信扫一扫。转账前请核对收款方信息。</p>
    </section>
    <div class="footer">Made with 💗</div>
  </main>
  <script>
    const button = document.getElementById('supportBtn');
    const panel = document.getElementById('qrPanel');
    button.addEventListener('click', () => {
      const isOpen = panel.classList.toggle('show');
      button.setAttribute('aria-expanded', String(isOpen));
      button.textContent = isOpen ? '💗 收起二维码' : '💖 支持一下';
    });
  </script>
</body>
</html>
